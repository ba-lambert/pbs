services:
  pbs_postgres:
    image: docker.io/postgis/postgis:17-3.5
    container_name: pbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pbs_postgres_data:/var/lib/postgresql/data
    networks:
      - pbs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pbs_api:
    image: ghcr.io/ba-lambert/pbs-api:latest
    container_name: pbs_api
    restart: unless-stopped
    environment:
      APP_NAME: PBS API
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pbs_postgres:5432/pbs_db
      POSTGRES_HOST: pbs_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pbs_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - pbs_uploads:/app/uploads
    networks:
      - pbs_net
    depends_on:
      pbs_postgres:
        condition: service_healthy

  pbs_client:
    image: ghcr.io/ba-lambert/pbs-client:latest
    container_name: pbs_client
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - pbs_net
    depends_on:
      - pbs_api

volumes:
  pbs_postgres_data:
  pbs_uploads:

networks:
  pbs_net:
    driver: bridge

name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ba-lambert

jobs:
  build-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/pbs-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    name: Build & push client image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/pbs-client
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/pbs

      - name: Deploy on VPS (zero-downtime)
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,GHCR_TOKEN,GITHUB_ACTOR
          command_timeout: 30m
          script: |
            set -e
            mkdir -p ~/pbs

            # Allow rootless Podman to bind port 80 (requires sudo; skipped if unavailable)
            sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80 2>/dev/null || true

            # Generate DB password and JWT secret once, reuse on every subsequent deploy
            if [ ! -f ~/pbs/.secrets ]; then
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >  ~/pbs/.secrets
              echo "JWT_SECRET=$(openssl rand -hex 32)"        >> ~/pbs/.secrets
              chmod 600 ~/pbs/.secrets
            fi
            source ~/pbs/.secrets

            # Write env file (Stripe comes from GitHub secrets, rest from .secrets)
            cat > ~/pbs/.env << EOF
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
            EOF
            chmod 600 ~/pbs/.env

            # Log in to GHCR using the workflow's GITHUB_TOKEN (valid for this run)
            echo "${GHCR_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            cd ~/pbs

            # ── Phase 1: pull new images while old containers are still serving ──
            echo ">>> Pulling new images (old containers keep running)..."
            podman-compose -f docker-compose.prod.yml pull

            # ── Phase 2: rolling restart (podman recreates only changed services) ──
            echo ">>> Restarting services..."
            podman-compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── Phase 3: wait for health checks (max 2 min) ──
            echo ">>> Waiting for health checks..."
            MAX_WAIT=120
            ELAPSED=0
            while [ $ELAPSED -lt $MAX_WAIT ]; do
              ALL_HEALTHY=true
              for c in pbs_api pbs_client; do
                STATUS=$(podman inspect "$c" --format "{{.State.Health.Status}}" 2>/dev/null || echo "missing")
                if [ "$STATUS" != "healthy" ]; then
                  ALL_HEALTHY=false
                  echo "  $c → $STATUS"
                fi
              done
              if $ALL_HEALTHY; then
                echo "  All services healthy after ${ELAPSED}s"
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "ERROR: health check timed out after ${MAX_WAIT}s"
                podman logs --tail 30 pbs_api   2>/dev/null || true
                podman logs --tail 30 pbs_client 2>/dev/null || true
                exit 1
              fi
            done

            echo ">>> Deploy complete."

      - name: Health report
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Container status ==="
            podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
            echo "=== Health details ==="
            for c in pbs_postgres pbs_api pbs_client; do
              STATUS=$(podman inspect "$c" --format "{{.State.Health.Status}}" 2>/dev/null || echo "no healthcheck")
              echo "  $c → $STATUS"
            done

services:
  pbs_api:
    image: python:3.12-slim
    container_name: pbs_api
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      APP_NAME: PBS API
      JWT_SECRET: change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@ptis_postgres:5432/pbs_db
      POSTGRES_HOST: ptis_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pbs_db
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python scripts/create_db.py &&
      alembic upgrade head &&
      python -m api.seed &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    networks:
      - default


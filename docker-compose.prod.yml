services:
  pbs_postgres:
    image: docker.io/postgis/postgis:17-3.5
    container_name: pbs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pbs_postgres_data:/var/lib/postgresql/data
    networks:
      - pbs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pbs_api:
    image: ghcr.io/ba-lambert/pbs-api:latest
    container_name: pbs_api
    restart: unless-stopped
    environment:
      APP_NAME: PBS API
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pbs_postgres:5432/pbs_db
      POSTGRES_HOST: pbs_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pbs_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      - pbs_uploads:/app/uploads
    networks:
      - pbs_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      pbs_postgres:
        condition: service_healthy

  pbs_client:
    image: ghcr.io/ba-lambert/pbs-client:latest
    container_name: pbs_client
    restart: unless-stopped
    networks:
      - pbs_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      pbs_api:
        condition: service_healthy

  pbs_caddy:
    image: docker.io/caddy:2-alpine
    container_name: pbs_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pbs_caddy_data:/data
      - pbs_caddy_config:/config
    networks:
      - pbs_net
    depends_on:
      pbs_client:
        condition: service_healthy
      pbs_api:
        condition: service_healthy

volumes:
  pbs_postgres_data:
  pbs_uploads:
  pbs_caddy_data:
  pbs_caddy_config:

networks:
  pbs_net:
    driver: bridge
